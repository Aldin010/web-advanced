<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
         <legend>Personal info</legend>
           <label for="firstname">First name:</label>
             <input type="text"id="firstname"name="firstname" value="John"readonly>
               <label for="lastname">Last Name:</label>
                 <input type="text"id="lastname"name="lastname" disabled>
                 <label for="email">email:</label><br>
             <input type="email" id="email" name="email" required>
           <label for="password">password:</label>
         <input type="password" id="password" name="password" size="40" placeholder="password">
         <label>gender</label><br>
         <input type="radio" id="male" name="gender" value="male">
         <label for="male">male</label>
         <input type="radio" id="female" name="gender" value="female">
         <label for="female">female</label>
         <label>Hobbies:</label><br>
         <input type="checkbox" id="gaming" name="gaming" value="gaming">
         <label for="gaming">gaming:</label><br>
         <input type="checkbox" id="football" name="football" value="football">
         <label for="football">football</label>
         <label for="pet">choose a pet</label>
         <select name="" id="">
         <option value="dog">Dog</option>
         <option value="cat">Cat</option>
         <option value="parrotx2">parrotx2</option>
         </select><br><br>
        </fieldset>
    </form>
</body>
</html>
